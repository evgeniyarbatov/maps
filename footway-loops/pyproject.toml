[project]
name = "footway-loops"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "networkx",
    "defusedxml>=0.7.1",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 99
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4", "UP", "SIM", "RET", "S"]
ignore = ["E501", "S101", "S603", "S607"]

[tool.ruff.format]
quote-style = "double"
